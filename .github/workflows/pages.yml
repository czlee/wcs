# Builds the results site (site/) and deploys it to GitHub Pages. The user
# site's custom domain (czlee.nz) covers this repo's project page, so with the
# repo named "wcs" this serves https://czlee.nz/wcs/judge-agreement/.
#
# The site's data (site/src/lib/data/) is committed, written by
# scripts/export_site_data.py: CI doesn't rerun the Python pipeline, whose
# inputs (data/) aren't in the repo.
name: Deploy site

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml, .nvmrc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # The site's JavaScript must reproduce compute_metrics.py for every scoresheet.
      - run: npm run check:metrics
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          BASE_PATH: /wcs/judge-agreement
      - name: Assemble Pages tree
        run: |
          mkdir -p _site
          cp -r site/build _site/judge-agreement
          cp site/static-root/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
